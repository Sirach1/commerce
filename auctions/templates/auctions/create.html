{% extends 'auctions/layout.html' %}

{% block body %}
<div style="padding: 50px;">
    <form action="{% url 'create' %}" method="post">
        <div class="form-group">
            <label for="title">Title (Product Name)</label>
            <input type="text" class="form-control" id="title" placeholder="Enter Title">
        </div>
        <div class="form-group">
            <label for="desc">Description</label>
            <input type="text" class="form-control" id="desc" placeholder="Description">
        </div>
        <div class="form-group">
            <label for="desc">Description</label>
            <textarea class="form-control" id="desc"></textarea>
        </div>
        <div class="form-group">
            <label for="init_bid">Starting bid</label>
            <input type="number" class="form-control" id="init_bid" placeholder="Price">
        </div>
        <div class="form-group">
            <label for="img">Img Url</label>
            <input type="number" class="form-control" id="img" placeholder="Price">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select class="form-control" id="category" multiple required>
                {% for category in categories %}
                <option value="{{ category.id }}">{{category}}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

{% endblock %}
